name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
  ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies (app)
        run: npm ci

      - name: Verify autopilot/cron import path
        run: npm run verify:autopilot-path

      - name: Verify future content guardrails
        run: npm run verify:future-content

      - name: Smoke AliExpress promotions
        if: ${{ env.ALIEXPRESS_APP_KEY != '' && env.ALIEXPRESS_APP_SECRET != '' }}
        run: npm run monitor:aliexpress-promotions
        env:
          ALIEXPRESS_APP_KEY: ${{ env.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ env.ALIEXPRESS_APP_SECRET }}

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint check
        run: npm run lint

      # - name: Run unit tests
      #   run: npm run test -- unified-currency.test.ts
      #   continue-on-error: true

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}

      - name: Install dependencies (functions)
        run: npm ci
        working-directory: okazje-plus

      - name: Build Cloud Functions
        run: npm run build
        working-directory: okazje-plus

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Configure Firebase credentials
        id: auth
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' > $HOME/firebase-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$HOME/firebase-key.json" >> $GITHUB_ENV
          firebase experiments:enable webframeworks

      - name: Prepare Firebase Functions params
        run: |
          cat > "okazje-plus/.env.${{ secrets.FIREBASE_PROJECT_ID }}" <<EOF
          SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          IMPORT_ADMIN_TOKEN=${{ secrets.IMPORT_ADMIN_TOKEN }}
          ADMIN_BEARER=${{ secrets.ADMIN_BEARER }}
          ALIEXPRESS_ACCESS_TOKEN=${{ secrets.ALIEXPRESS_ACCESS_TOKEN }}
          CONVERTISER_API_TOKEN=${{ secrets.CONVERTISER_API_TOKEN }}
          ALIEXPRESS_SYNC_MAX_ITEMS=20
          EOF

      - name: Remove stale frameworks function (ssrokazjeplus)
        run: |
          firebase functions:delete ssrokazjeplus --region us-central1 --project ${{ secrets.FIREBASE_PROJECT_ID }} --force || true
          firebase functions:delete ssrokazjeplus --region europe-west4 --project ${{ secrets.FIREBASE_PROJECT_ID }} --force || true
          firebase functions:delete firebase-frameworks-${{ secrets.FIREBASE_PROJECT_ID }}:ssrokazjeplus --region us-central1 --project ${{ secrets.FIREBASE_PROJECT_ID }} --force || true

      - name: Deploy Hosting + Functions
        run: firebase deploy --only hosting,functions --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive --force
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          GOOGLE_GENAI_API_KEY: ${{ secrets.GOOGLE_GENAI_API_KEY }}

      - name: Rollout Firebase App Hosting backend
        run: |
          firebase apphosting:rollouts:create okazje-plus-backend --git-commit ${{ github.sha }} --project ${{ secrets.FIREBASE_PROJECT_ID }} --force

      - name: Deploy Firestore rules + indexes
        run: firebase deploy --only firestore:rules,firestore:indexes --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive --force

      - name: Cleanup key
        if: always()
        run: |
          rm -f $HOME/firebase-key.json
          rm -f "okazje-plus/.env.${{ secrets.FIREBASE_PROJECT_ID }}"
