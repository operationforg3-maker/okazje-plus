name: Update Tools Inventory

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/**/admin/**'
      - 'src/app/api/**'
      - 'src/ai/**'
      - '**/*.test.ts'
      - '**/*.spec.ts'
      - 'tests/**'
      - 'scripts/generate-tools-inventory.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate tools inventory
        run: npm run report:tools

      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet docs/reports/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reports/
          git commit -m "chore(reports): auto-update tools inventory [skip ci]"
          git push
