name: Update Tools Inventory (to GCS)

on:
  push:
    branches:
      - main
    paths:
      - 'src/app/**/admin/**'
      - 'src/app/api/**'
      - 'src/ai/**'
      - '**/*.test.ts'
      - '**/*.spec.ts'
      - 'tests/**'
      - 'scripts/generate-tools-inventory.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for git log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Generate tools inventory (uploads to GCS)
        run: npm run report:tools
        env:
          GCS_BUCKET: ${{ secrets.GCS_BUCKET_NAME || 'okazje-plus-reports' }}

      - name: Verify upload
        run: |
          gcloud storage ls gs://${{ secrets.GCS_BUCKET_NAME || 'okazje-plus-reports' }}/tools-inventory/
          echo "✅ Tools inventory uploaded to GCS successfully"
