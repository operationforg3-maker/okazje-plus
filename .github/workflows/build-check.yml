name: Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Verify autopilot/cron import path
        run: npm run verify:autopilot-path
      
      - name: Run TypeScript check
        run: npm run typecheck || true

      - name: Run lint
        run: npm run lint
      
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBk-qFQwDIlsHSnhugoQSN7abcoMX3mTl4
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: okazje-plus.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: okazje-plus
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: okazje-plus.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '298894101105'
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:298894101105:web:20a99f74b145cdf3ee29d0
          NEXT_PUBLIC_SITE_URL: https://okazje-plus.web.app
          GOOGLE_GENAI_API_KEY: placeholder-key

  status:
    name: Deployment Status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print context
        run: |
          echo "Actor: $GITHUB_ACTOR"
          echo "Ref:   $GITHUB_REF"
          echo "SHA:   $GITHUB_SHA"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Run status shell script
        run: .github/scripts/deploy-status.sh
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
