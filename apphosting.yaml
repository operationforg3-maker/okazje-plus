# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
# Updated: 2025-12-12 15:35 - Force rebuild with skipExisting=false fix
runConfig:
  minInstances: 0
  maxInstances: 100
  concurrency: 200
  cpu: 2
  memoryMiB: 2048
  timeoutSeconds: 3600
  network:
    vpcAccess:
      connector: projects/okazje-plus/locations/europe-west1/connectors/redis-connector
      egress: ALL_TRAFFIC

# Environment variables for the Next.js build process.
# These are used to embed the Firebase config into the client-side code.
# See https://firebase.google.com/docs/app-hosting/configure#environment-variables
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyDEXXgEyT89tvOcYlmSm_dJbTqToLdju9w
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: okazje-plus.firebaseapp.com
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: okazje-plus
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: okazje-plus.firebasestorage.app
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: '298894101105'
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:298894101105:web:b8eec4c8d2cae659ee29d0
    availability:
      - BUILD
  
  # Site URL for metadata/OG images
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://okazjeplus.pl
    availability:
      - BUILD
      - RUNTIME
  

  # Firebase Admin Service Account (JSON) provided via Secret Manager
  # Code reads this from env var FIREBASE_SERVICE_ACCOUNT_JSON and initializes admin SDK with cert()
  - variable: FIREBASE_SERVICE_ACCOUNT_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_JSON
    availability:
      - RUNTIME
  
  # Vertex AI configuration (uses Firebase project ADC automatically)
  - variable: VERTEX_AI_LOCATION
    value: europe-west1
    availability:
      - BUILD
      - RUNTIME
  
  - variable: GOOGLE_CLOUD_PROJECT
    value: okazje-plus
    availability:
      - BUILD
      - RUNTIME

  # Gemini/GenAI API key (optional fallback for non-Vertex flows)
  - variable: GOOGLE_GENAI_API_KEY
    secret: GOOGLE_GENAI_API_KEY
    availability:
      - RUNTIME
  
  - variable: FIREBASE_PROJECT_ID
    value: okazje-plus
    availability:
      - BUILD
      - RUNTIME
  
  - variable: TEST_USER_EMAIL
    secret: TEST_USER_EMAIL
    availability:
      - RUNTIME
  - variable: TEST_USER_PASSWORD
    secret: TEST_USER_PASSWORD
    availability:
      - RUNTIME
  - variable: TEST_ADMIN_EMAIL
    secret: TEST_ADMIN_EMAIL
    availability:
      - RUNTIME
  - variable: TEST_ADMIN_PASSWORD
    secret: TEST_ADMIN_PASSWORD
    availability:
      - RUNTIME

  # AliExpress integration (server-side only)
  - variable: ALIEXPRESS_API_BASE
    secret: ALIEXPRESS_API_BASE
    availability:
      - RUNTIME
  - variable: ALIEXPRESS_API_ENDPOINT
    secret: ALIEXPRESS_API_ENDPOINT
    availability:
      - RUNTIME
  - variable: ALIEXPRESS_APP_KEY
    secret: ALIEXPRESS_APP_KEY
    availability:
      - RUNTIME
  - variable: ALIEXPRESS_APP_SECRET
    secret: ALIEXPRESS_APP_SECRET
    availability:
      - RUNTIME
  - variable: ALIEXPRESS_AFFILIATE_ID
    secret: ALIEXPRESS_AFFILIATE_ID
    availability:
      - RUNTIME
  - variable: ALIEXPRESS_TRACKING_ID
    secret: ALIEXPRESS_TRACKING_ID
    availability:
      - RUNTIME
  - variable: ALIEXPRESS_REGION
    secret: ALIEXPRESS_REGION
    availability:
      - RUNTIME
  - variable: ALIEXPRESS_RATE_LIMIT
    value: '50'
    availability:
      - RUNTIME

  # Convertiser API (server-side only)
  - variable: CONVERTISER_API_TOKEN
    secret: CONVERTISER_API_TOKEN
    availability:
      - RUNTIME
  - variable: CONVERTISER_WEBSITE_UUID
    value: 3bc0a4fd6e7289720f9c2784de4b87f345bcca47
    availability:
      - RUNTIME

  # TradeTracker Affiliate Integration
  - variable: TRADETRACKER_CUSTOMER_ID
    value: '303535'
    availability:
      - RUNTIME
  - variable: TRADETRACKER_PASSPHRASE
    value: f4c237c9c4e81bed1055af97f9aadf8b8c815dab
    availability:
      - RUNTIME
  - variable: TRADETRACKER_SITE_ID
    value: '511688'
    availability:
      - RUNTIME
  - variable: TRADETRACKER_LOCALE
    value: pl_PL
    availability:
      - RUNTIME

  # Cron job security (background task processing)
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME
  
  # FX API for live currency conversion
  - variable: FX_API_URL
    value: https://api.exchangerate.host/latest
    availability:
      - RUNTIME

  # Typesense (wyszukiwarka) – host/port/protocol używane także w build (embed do klienta)
  - variable: NEXT_PUBLIC_TYPESENSE_HOST
    secret: TYPESENSE_HOST
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_TYPESENSE_PORT
    secret: TYPESENSE_PORT
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_TYPESENSE_PROTOCOL
    secret: TYPESENSE_PROTOCOL
    availability:
      - BUILD
      - RUNTIME
  # Search-only API key (public dla klienta wyszukiwania; bezpieczny read-only)
  - variable: NEXT_PUBLIC_TYPESENSE_SEARCH_ONLY_API_KEY
    secret: TYPESENSE_SEARCH_ONLY_API_KEY
    availability:
      - BUILD
      - RUNTIME
  # Server-side host/port/protocol for API routes and server rendering
  - variable: TYPESENSE_HOST
    secret: TYPESENSE_HOST
    availability:
      - RUNTIME
  - variable: TYPESENSE_PORT
    secret: TYPESENSE_PORT
    availability:
      - RUNTIME
  - variable: TYPESENSE_PROTOCOL
    secret: TYPESENSE_PROTOCOL
    availability:
      - RUNTIME
  # Server-side search-only key (fallback dla API routes)
  - variable: TYPESENSE_SEARCH_ONLY_API_KEY
    secret: TYPESENSE_SEARCH_ONLY_API_KEY
    availability:
      - RUNTIME
  # Admin API key (pełny dostęp do indeksowania; tylko runtime, server-side)
  - variable: TYPESENSE_ADMIN_API_KEY
    secret: TYPESENSE_ADMIN_API_KEY
    availability:
      - RUNTIME

  - variable: REDIS_URL
    secret: REDIS_URL
    availability:
      - RUNTIME
