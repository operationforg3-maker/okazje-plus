steps:
  # 1. Install dependencies & run typecheck/lint
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
    id: 'install-deps'

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'verify:future-content']
    id: 'verify-guardrails'
    env:
      - 'NODE_OPTIONS=--max-old-space-size=4096'

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'lint']
    id: 'lint'
    env:
      - 'NODE_OPTIONS=--max-old-space-size=4096'

  # 2. Build Next.js App
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    id: 'build-next'
    env:
      - 'NEXT_PUBLIC_FIREBASE_API_KEY=$_NEXT_PUBLIC_FIREBASE_API_KEY'
      - 'NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN'
      - 'NEXT_PUBLIC_FIREBASE_PROJECT_ID=okazje-plus'
      - 'NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=$_NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET'
      - 'NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=$_NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID=$_NEXT_PUBLIC_FIREBASE_APP_ID'
      - 'NEXT_PUBLIC_SITE_URL=$_NEXT_PUBLIC_SITE_URL'
      - 'NODE_OPTIONS=--max-old-space-size=4096'
    secretEnv: ['GOOGLE_GENAI_API_KEY']

  # 3. Build Cloud Functions
  - name: 'node:20'
    entrypoint: 'npm'
    args: ['ci']
    dir: 'okazje-plus'
    id: 'install-deps-functions'

  - name: 'node:20'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'okazje-plus'
    id: 'build-functions'
    env:
      - 'NODE_OPTIONS=--max-old-space-size=4096'

  # 4. Deploy using Firebase CLI
  - name: 'node:20'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm install -g firebase-tools
        
        # Prepare environment file for functions using Secret Manager variables
        cat > "okazje-plus/.env.okazje-plus" <<EOF
        SITE_URL=$_NEXT_PUBLIC_SITE_URL
        CRON_SECRET=$$CRON_SECRET
        CONVERTISER_API_TOKEN=$$CONVERTISER_API_TOKEN
        ALIEXPRESS_SYNC_MAX_ITEMS=20
        EOF
        
        # Deploy Cloud Functions
        firebase deploy --only functions --project okazje-plus --non-interactive --force
        
        # Deploy App Hosting Next.js Backend Rollout
        firebase apphosting:rollouts:create okazje-plus-backend --git-commit $COMMIT_SHA --project okazje-plus --force
        
        # Deploy Firestore rules & indexes
        firebase deploy --only firestore:rules,firestore:indexes --project okazje-plus --non-interactive --force
    id: 'deploy-all'
    secretEnv:
      - 'CRON_SECRET'
      - 'CONVERTISER_API_TOKEN'

# Fetch Secrets natively from Google Secret Manager
availableSecrets:
  secretManager:
    - versionName: projects/okazje-plus/secrets/CRON_SECRET/versions/latest
      env: 'CRON_SECRET'
    - versionName: projects/okazje-plus/secrets/GOOGLE_GENAI_API_KEY/versions/latest
      env: 'GOOGLE_GENAI_API_KEY'
    - versionName: projects/okazje-plus/secrets/CONVERTISER_API_TOKEN/versions/latest
      env: 'CONVERTISER_API_TOKEN'

substitutions:
  _NEXT_PUBLIC_FIREBASE_API_KEY: 'AIzaSyBk-qFQwDIlsHSnhugoQSN7abcoMX3mTl4'
  _NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'okazje-plus.firebaseapp.com'
